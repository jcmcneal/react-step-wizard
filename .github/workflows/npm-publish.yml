name: Publish reviewed npm tag
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable reviewed Git tag (v + package version)
        required: true
      npm_dist_tag:
        description: npm dist-tag (beta for prereleases)
        required: true
        default: beta
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify version and dist-tag
        run: node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(process.env.RELEASE_TAG !== `v${p.version}`) throw Error("Tag/version mismatch"); if(!/^[a-z][a-z0-9-]*$/.test(process.env.NPM_DIST_TAG)) throw Error("Invalid npm dist-tag"); if(p.version.includes("-") && process.env.NPM_DIST_TAG === "latest") throw Error("Prerelease cannot use latest");'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - name: Publish approved package
        run: npm publish --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
